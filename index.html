<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MiniDroid</title>
<meta name="description" content="MiniDroid – portable Android compatibility runtime for Linux x86_64.">

<style>
:root {
  --bg: #0b1020;
  --panel: #11182b;
  --text: #eef3ff;
  --muted: #aab6d3;
  --accent: #69a7ff;
  --border: #25314d;
}
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; }
body {
  font-family: Arial, Helvetica, sans-serif;
  background: var(--bg);
  color: var(--text);
  line-height: 1.6;
}
main {
  width: min(900px, calc(100% - 32px));
  margin: 0 auto;
  padding: 64px 0 48px;
}
.card {
  background: var(--panel);
  border: 1px solid var(--border);
  border-radius: 18px;
  padding: 32px;
  box-shadow: 0 16px 40px rgba(0,0,0,.22);
}
h1, h2 { line-height: 1.2; }
h1 { font-size: clamp(2rem, 5vw, 3.5rem); margin-top: 0; }
h2 { margin-top: 2rem; }
p, li { color: var(--muted); }
a { color: var(--accent); text-decoration: none; }
a:hover { text-decoration: underline; }
footer {
  border-top: 1px solid var(--border);
  margin-top: 48px;
  padding: 24px 16px 32px;
  text-align: center;
  color: var(--muted);
  font-size: .95rem;
}
footer a { margin: 0 8px; }
.small { font-size: .9rem; }
</style>

</head>
<body>
<main>
  <section class="card">
    <h1>MiniDroid</h1>
    <p>MiniDroid is a portable Android compatibility runtime for Linux x86_64.</p>
    <p>This website provides basic project information and legal notices.</p>
  </section>
</main>

<footer>
  <div>&copy; 2026 Tarek Wasfy</div>
  <div>
    <a href="privacy.html">Privacy</a>
    <a href="impressum.html">Impressum</a>
  </div>
</footer>

</body>
</html>
